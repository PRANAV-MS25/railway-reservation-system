<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RailPulse - Step 1: Journey Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8 flex justify-center items-center">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3 border-b border-slate-800 pb-4">
            <div class="bg-blue-600 p-2.5 rounded-lg text-white"><i class="fa-solid fa-train text-lg"></i></div>
            <div>
                <h2 class="text-lg font-bold">Plan Your Railway Journey</h2>
                <p class="text-xs text-slate-400">Step 1: Define Route & Travel Date</p>
            </div>
        </div>
        <form action="/trains" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">From Station</label>
                <select name="from" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
                    <option value="KSR Bengaluru (SBC)">KSR Bengaluru (SBC)</option>
                    <option value="Mumbai Central (MMCT)">Mumbai Central (MMCT)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">To Station</label>
                <select name="to" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
                    <option value="New Delhi (NDLS)">New Delhi (NDLS)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Journey Date</label>
                <input type="date" name="date" id="j-date" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg text-sm transition shadow-lg">
                Search Available Trains &rarr;
            </button>
        </form>
    </div>
    <script>document.getElementById('j-date').valueAsDate = new Date();</script>
</body>
</html>
