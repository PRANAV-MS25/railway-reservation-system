<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RailPulse - Passenger Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="bg-blue-600 text-xs font-bold px-2.5 py-1 rounded">RAIL</span>
                <span class="text-xl font-bold tracking-wide">RailPulse System</span>
            </div>
            <div class="flex space-x-6 text-sm font-medium">
                <a href="/home" class="hover:text-blue-400 transition">Home</a>
                <a href="/" class="text-red-400 hover:text-red-300 transition">Logout</a>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto py-12 px-6">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-900 mb-6">Passenger Manifest & Payment</h1>

            <form action="/ticket" method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Passenger Full Name</label>
                    <input type="text" name="passenger_name" required placeholder="e.g. M Pranav" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Age</label>
                        <input type="number" name="passenger_age" required placeholder="e.g. 22" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Gender</label>
                        <select name="passenger_gender" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white transition">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Berth Preference</label>
                    <select name="berth_preference" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white transition">
                        <option value="Lower">Lower Berth</option>
                        <option value="Middle">Middle Berth</option>
                        <option value="Upper">Upper Berth</option>
                        <option value="Side Lower">Side Lower</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Payment Mode</label>
                    <select name="payment_mode" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white transition">
                        <option value="UPI / Google Pay / PhonePe">UPI / Google Pay / PhonePe</option>
                        <option value="Credit / Debit Card">Credit / Debit Card</option>
                        <option value="Net Banking">Net Banking</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-lg shadow transition duration-200 mt-4">
                    Complete Payment & Confirm Ticket
                </button>
            </form>
        </div>
    </main>
</body>
</html>
