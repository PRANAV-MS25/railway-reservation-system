<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RailPulse - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full border border-slate-200 transform transition-all duration-300 hover:scale-[1.01]">
        <div class="text-center mb-8">
            <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">RAILPULSE SYSTEM</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-3">Welcome Back</h1>
            <p class="text-slate-600 text-sm mt-1">Sign in to manage your bookings and live tracking.</p>
        </div>

        <form action="/home" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="pranav@example.com" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition duration-200">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition duration-200">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold py-3.5 rounded-lg shadow-md transition duration-200">
                Secure Login
            </button>
        </form>
    </div>
</body>
</html>
